<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Linh Ngo</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* VIDEO NỀN */

.video-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:-1;
}

/* HEADER */

.header{
position:absolute;
top:25px;
left:30px;

display:flex;
align-items:center;
gap:20px;
}

/* AVATAR */

.avatar{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;

border:3px solid #00ffff;

box-shadow:
0 0 10px #00ffff,
0 0 20px #00ffff,
0 0 40px #00ffff;
}

/* TÊN */

.name{
font-family:'Orbitron',sans-serif;
font-size:3rem;
font-weight:900;

color:#00ffff;

text-shadow:
0 0 10px #00ffff,
0 0 20px #00ffff,
0 0 40px #00ffff,
0 0 80px #00ffff;
}

/* TRANG ĐẦU */

.hero{
height:100vh;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* ICON SOCIAL */

.socials{
display:flex;
gap:25px;
margin-top:120px;
}

.socials a img{
width:60px;
height:60px;

transition:.3s;

filter:
drop-shadow(0 0 10px cyan)
drop-shadow(0 0 20px cyan);
}

.socials a:hover img{
transform:translateY(-8px) scale(1.1);

filter:
drop-shadow(0 0 15px cyan)
drop-shadow(0 0 40px cyan);
}

/* SCROLL */

.scroll{
margin-top:50px;
font-size:20px;
animation:move 1.5s infinite;
}

@keyframes move{
50%{
transform:translateY(10px);
}
}

/* GIỚI THIỆU */

.about{
min-height:100vh;
padding:120px 10%;
background:#050505;
}

.about h2{
font-family:'Orbitron';
font-size:3rem;

color:#00ffff;

margin-bottom:30px;
}

.about p{
font-size:1.2rem;
line-height:2;
max-width:1000px;
}

</style>
</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop playsinline class="video-bg">
<source src="background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- GÓC TRÁI -->

<div class="header">

<!-- ẢNH CỦA BẠN -->
<img src="avatar.png" class="avatar">

<h1 class="name">Ling Ngo </h1>

</div>


<div class="scroll">
↓ 
</div>

</section>

<!-- GIỚI THIỆU -->

<section class="about">

<h2>Profiles</h2>

<p>

Tên: Linh Ngô



</p>

</section>

</body>
</html>
