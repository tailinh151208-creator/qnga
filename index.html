<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lưu bút Quỳnh Nga</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <style>
        :root {
            --neon-blue: #00d4ff;
            --bg-dark: #0f172a;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1e293b, #0f172a);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #book {
            width: 800px;
            height: 500px;
        }

        .page {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid #cbd5e1;
        }

        h2 { color: #1e293b; text-align: center; margin-bottom: 20px; }

        form { display: flex; flex-direction: column; gap: 15px; }

        input, textarea {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        button {
            padding: 15px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        /* Hiệu ứng Glow cho nút */
        .btn-glow {
            box-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue) !important;
            background: var(--neon-blue) !important;
            color: #000 !important;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="book">
        <div class="page">
            <h2>Gửi lời yêu thương</h2>
            <form id="luuButForm">
                <input type="text" name="name" placeholder="Tên của bạn" required>
                <textarea name="message" rows="4" placeholder="Viết gì đó cho Quỳnh Nga..." required></textarea>
                <button type="submit" id="submitBtn">Xác nhận gửi</button>
            </form>
        </div>
        <div class="page" style="align-items: center; justify-content: center;">
            <h2>Đã gửi thành công!</h2>
            <p>Cảm ơn bạn đã để lại lời nhắn.</p>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Khởi tạo sách
            $("#book").turn({
                width: 800,
                height: 500,
                autoCenter: true,
                duration: 1200 // Tốc độ lật trang
            });

            // Xử lý gửi
            $('#luuButForm').on('submit', function(e) {
                e.preventDefault();
                const btn = $('#submitBtn');
                
                // Hiệu ứng Glow khi nhấn
                btn.addClass('btn-glow').text('Đang gửi...');

                fetch('https://script.google.com/macros/s/AKfycbzxpaDqMhmS5OiIaRmwUWu345usgxJwBTkoyioDgogOHehqMNrsuBcDAVMxY1ZrFi9u4g/exec', {
                    method: 'POST',
                    body: new FormData(this)
                })
                .then(() => {
                    btn.text('Gửi thành công!');
                    setTimeout(() => {
                        $("#book").turn("next"); // Lật sang trang 2 sau khi gửi
                    }, 800);
                });
            });
        });
    </script>
</body>
</html>
